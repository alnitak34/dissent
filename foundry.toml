[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
gas_limit = 9223372036854775807
network = "monad"
# Verificacion publica en Monad (docs.monad.xyz/guides/verify-smart-contract/foundry):
# metadata CBOR presente, sin hash de metadata en el bytecode, y fuente literal
# embebida para que el verificador reconstruya sin depender de rutas.
cbor_metadata = true
bytecode_hash = "none"
use_literal_content = true

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 32
fail_on_revert = false
